<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" fill="none">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2f6fb"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="400" height="200" fill="#0d1117"/>

  <!-- ambient glow -->
  <ellipse cx="200" cy="100" rx="150" ry="90" fill="url(#glow)">
    <animate attributeName="rx" values="150;160;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- outer almond eye shape -->
  <g stroke="#22d3ee" stroke-width="2.5" filter="url(#blur)">
    <path d="M60 100 Q200 20 340 100 Q200 180 60 100 Z" fill="none" opacity="0.9"/>
  </g>
  <path d="M60 100 Q200 20 340 100 Q200 180 60 100 Z" fill="none" stroke="#e2f6fb" stroke-width="1.5" opacity="0.7"/>

  <!-- clip so iris stays inside eye -->
  <clipPath id="eyeClip"><path d="M60 100 Q200 20 340 100 Q200 180 60 100 Z"/></clipPath>

  <g clip-path="url(#eyeClip)">
    <!-- iris scanning left/right -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 55 0; 55 0; -55 0; -55 0; 0 0" keyTimes="0;0.2;0.35;0.6;0.75;1"
        dur="6s" repeatCount="indefinite"/>
      <circle cx="200" cy="100" r="46" fill="url(#iris)"/>
      <circle cx="200" cy="100" r="46" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <!-- pupil -->
      <circle cx="200" cy="100" r="20" fill="#050a0e">
        <animate attributeName="r" values="20;14;20" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- highlight -->
      <circle cx="186" cy="86" r="7" fill="#e2f6fb" opacity="0.85"/>
    </g>
  </g>

  <!-- blink: upper + lower lids sweep -->
  <g fill="#0d1117">
    <rect x="55" y="0" width="290" height="0" >
      <animate attributeName="height" values="0;0;100;0;0" keyTimes="0;0.9;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="55" y="200" width="290" height="0">
      <animate attributeName="y" values="200;200;100;200;200" keyTimes="0;0.9;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;0;100;0;0" keyTimes="0;0.9;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- re-draw eye outline over lids -->
  <path d="M60 100 Q200 20 340 100 Q200 180 60 100 Z" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.9"/>
</svg>
